name: Precompute city offers

# Mantém CityCourseOfferCache fresco — fonte de verdade do gate de indexação das
# city pages (app/cursos/[slug]/[city]) e da emissão do sitemap. Sem isso o cache
# envelhece, as páginas caem no fallback de API ao vivo e voltam a oscilar entre
# index/noindex. Roda no GitHub Actions (não na Vercel) porque é job de horas e
# funções serverless da Vercel têm limite de duração.
#
# A rodada é INCREMENTAL: revarrer os 76.320 pares toda semana passou a não caber
# no teto de 300min — em 30/08 o job foi CANCELADO em 5h00m19s no meio da fila, e
# as 30.900 linhas não alcançadas ficaram com medição de 23/08. Agora só reconsulta
# o que passou de --max-age-days, na ordem do mais velho pro mais novo, e encerra
# sozinho em --time-budget-min pra imprimir o resumo em vez de morrer sem registro.

on:
  schedule:
    # Semanal — domingo 03:17 UTC (~00:17 BRT). Minuto fora do :00 de propósito.
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      city_limit:
        description: 'Cidades por curso (top N por ranking)'
        required: false
        default: '160'
      concurrency:
        description: 'Chamadas paralelas à Tartarus'
        required: false
        default: '4'
      max_age_days:
        description: 'Só reconsulta cache mais velho que N dias (0 = revarrer tudo)'
        required: false
        default: '6'

# Evita duas execuções simultâneas escrevendo no mesmo cache.
concurrency:
  group: precompute-city-offers
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Precompute CityCourseOfferCache
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_TARTARUS_API: ${{ secrets.NEXT_PUBLIC_TARTARUS_API }}
        run: >-
          npx tsx scripts/precompute-city-offers.ts
          --city-limit=${{ github.event.inputs.city_limit || '160' }}
          --concurrency=${{ github.event.inputs.concurrency || '4' }}
          --max-age-days=${{ github.event.inputs.max_age_days || '6' }}
          --time-budget-min=280
